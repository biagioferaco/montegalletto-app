name: Aggiorna stato e pubblica

on:
  schedule:
    - cron: "*/20 * * * *"   # ogni 20 minuti (GitHub può ritardare di qualche minuto)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: |
          python -m unittest discover -s tests
          node --test tests/schedule.test.mjs

      - name: Leggi gli avvisi AMT
        run: |
          for i in 1 2 3; do
            python scraper/build_status.py && exit 0
            sleep 20
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
